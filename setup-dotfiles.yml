---
- name: Setup dotfiles based on hostname
  hosts: localhost
  connection: local
  vars:
    dotfiles_dir: "{{ playbook_dir }}"
    # Auto-detect target user - if run with sudo, use SUDO_USER, otherwise current user
    target_user: "{{ ansible_facts['env'].SUDO_USER | default(ansible_facts['env'].USER) }}"
    target_home: "{% if target_user == 'root' %}/root{% elif ansible_facts['os_family'] == 'Darwin' %}/Users/{{ target_user }}{% else %}/home/{{ target_user }}{% endif %}"
    home_dir: "{{ target_home }}"  # Added for compatibility
    config_dir: "{{ target_home }}/.config"
    oh_my_zsh_dir: "{{ target_home }}/.oh-my-zsh"
    hostname: "{{ ansible_facts['hostname'] }}"
    is_personal_machine: "{{ hostname in ['kyrios', 'shinkiro', 'barbatos'] }}"
    # Headless Debian servers (currently: virtue): shell + editor only, no
    # desktop, no dev toolchain. Detected by OS family rather than hostname so
    # any Debian box gets the server profile without touching this file.
    is_server_machine: "{{ ansible_facts['os_family'] == 'Debian' }}"
    running_as_root: "{{ ansible_facts['user_id'] == 'root' }}"

    # Load private configuration if available
    private_config_file: "{{ dotfiles_dir }}/private-config/config.yml"

    # kyrios, shinkiro and barbatos are personal Arch Linux machines,
    # any Debian host (currently virtue) is a headless server,
    # any other hostname is a work machine (currently macOS)

    # Configs allowed on work machines
    work_configs:
      - ghostty
      - nvim
      - btop
      - broot
      - lazygit
      - git
      - rbenv
      - nodenv
      - fastfetch
      - opencode

    # Configs linked on servers (headless Debian) — editor only
    server_configs:
      - nvim

    # Neovim on Debian: apt ships a version too old for LazyVim, so servers
    # get the official release tarball instead (see tasks/packages.yml).
    # Pinned to an exact release with its sha256 per arch. To upgrade, bump
    # the version and both hashes together, then re-run; the old release
    # stays under /opt/nvim-<old> until removed by hand.
    neovim_release: v0.12.5
    neovim_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'x86_64' }}"
    neovim_sha256:
      x86_64: bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875
      arm64: 1aa5ca085249580ae0f91eb14f27ec0919773ff2d99a163d03f3d6c21ac29725

    # apt packages for servers — the shell, what the LazyVim config needs
    # (treesitter build deps, pickers, lazygit), and the libraries ruby-build
    # needs to compile Ruby. Ruby and Node themselves come from rbenv/nodenv
    # via tasks/devtools.yml, the same as on the other machines.
    server_packages:
      - zsh
      - git
      - curl
      - ca-certificates
      - build-essential   # C compiler for treesitter parsers and ruby-build
      - unzip             # mason archives, sdkman
      - zip               # sdkman
      - ripgrep
      - fd-find           # Debian names the binary fdfind; symlinked as fd in tasks/dotfiles.yml
      - lazygit           # LazyVim git UI
      - tmux
      # ruby-build dependencies (https://github.com/rbenv/ruby-build/wiki)
      - autoconf
      - patch
      - libssl-dev
      - libyaml-dev
      - libreadline-dev
      - zlib1g-dev
      - libgmp-dev
      - libncurses-dev
      - libffi-dev
      - libgdbm-dev
      - libdb-dev
      - uuid-dev

    required_packages:
      # Core utilities
      - zsh
      - git
      - fastfetch      # the shell greeting; its config is symlinked per machine
      - github-cli
      - neovim
      - lazygit
      - jq
      - ripgrep
      - fd
      - fzf
      - bat
      - htop
      - btop
      - tmux
      - rsync
      - unzip
      - broot
      - zip
      - wget
      - wl-clipboard
      - cliphist
      - xdg-utils

      # Desktop environment
      - hyprland
      - hyprlock
      - waybar
      - dunst
      - grim
      - slurp
      - hyprpaper
      - hypridle
      - greetd
      - greetd-regreet
      - cage
      - playerctl
      - pamixer
      - brightnessctl
      - xdg-desktop-portal-hyprland
      - hyprpolkitagent
      - qt5-wayland
      - qt6-wayland

      # Audio
      - pipewire
      - pipewire-alsa
      - pipewire-jack
      - pipewire-pulse
      - pavucontrol

      # Fonts
      - powerline-fonts
      - ttf-jetbrains-mono-nerd
      - ttf-nerd-fonts-symbols
      - noto-fonts-emoji

      # Applications
      - ghostty
      - thunar
      - gvfs            # thunar: mount removable drives / USB mass storage via udisks2
      - thunar-volman   # thunar: auto-mount on plug-in
      - firefox
      - obsidian
      - telegram-desktop
      - steam

      # Hardware monitoring
      - nvtop
      - smartmontools

      # Network & Bluetooth (quickshell tiles use nmcli/bluetoothctl)
      - networkmanager
      - bluez
      - bluez-utils

    aur_packages:
      - discord
      - slack-desktop
      - 1password
      - 1password-cli
      - wlogout
      - opencode-bin
      - grimblast-git
      - hyprlauncher
      - quickshell-git   # QML desktop shell (bar/omni); git tracks current Qt

    # Machine-specific packages
    shinkiro_packages:  # Desktop with AMD GPU
      - radeontop
      - corectrl
      - vulkan-radeon
      - xf86-video-amdgpu

    kyrios_packages:  # Laptop with Intel CPU/GPU
      - intel-ucode
      - intel-media-driver
      - libva-intel-driver
      - vulkan-intel
      - fprintd
      - libfprint
      - network-manager-applet

    barbatos_packages:  # ThinkPad T470p: Intel HD 630 + NVIDIA 940MX (Maxwell)
      # Intel iGPU drives the desktop
      - intel-ucode
      - intel-media-driver
      - vulkan-intel
      # NVIDIA: the driver itself is nvidia-580xx-dkms from the AUR (below);
      # nvidia-open does NOT support Maxwell. These are its pacman-side deps.
      - linux-headers
      - dkms
      - linux-firmware-nvidia
      # nvidia-prime is in barbatos_aur_packages, AFTER nvidia-580xx-utils:
      # installed from here it would pull the stock nvidia-utils back in to
      # satisfy its dependency.
      - mesa-utils              # glxinfo, for verifying prime-run
      # Power / thermal
      - thermald
      - power-profiles-daemon
      - earlyoom
      # Network stack from the runbook: iwd + networkd, tailscale, ufw, mDNS
      - iwd
      - tailscale
      - ufw
      - avahi
      - nss-mdns
      # Docker (tasks/barbatos.yml enables the service and adds the docker group)
      - docker
      - docker-buildx
      - docker-compose
      # Misc hardware
      - fwupd
      - cups
      - system-config-printer
      # Embedded dev: Raspberry Pi Pico (PicoRuby/R2P2) and ESP32. The udev
      # rules come from PlatformIO (tasks/barbatos.yml), serial access from
      # the uucp group. BOOTSEL mode shows up as a USB drive (RPI-RP2) and
      # mounts through thunar; `picocom -b 115200 /dev/ttyACM0` for the shell.
      - picocom
      - screen
      - usbutils

    # Fingerprint for sudo/su on barbatos. Off by default: pam_fprintd waits
    # for a touch before falling back to the password, which stalls anything
    # that drives sudo non-interactively — including this playbook's become.
    # Flip to true (or pass -e barbatos_fingerprint_sudo=true) once you want
    # it; hyprlock, sddm and polkit always get the fingerprint prompt.
    barbatos_fingerprint_sudo: false

    # EnvyControl mode for the 940MX. "hybrid" keeps the dGPU available via
    # prime-run but it can never power down (Maxwell has no RTD3 support —
    # /proc/driver/nvidia/gpus/*/power says "Not supported"), so it draws
    # power at idle. "integrated" removes it from the PCI bus at boot: best
    # battery life, no prime-run. Either way a reboot applies the switch.
    barbatos_gpu_mode: hybrid

    barbatos_aur_packages:  # ThinkPad T470p AUR packages
      - nvidia-580xx-dkms     # legacy branch for Maxwell (GM108M)
      - nvidia-580xx-utils
      - nvidia-prime          # prime-run (repo package; here so it binds to 580xx-utils)
      - envycontrol           # hybrid / integrated / nvidia switching (barbatos_gpu_mode)
      - envy-tui              # TUI front-end for envycontrol (waybar GPU module)
      - open-fprintd          # fingerprint daemon (works with python-validity)
      - fprintd-clients-git   # fprintd client tools (enroll, verify, list)
      - python-validity       # Validity 138a:0097 fingerprint sensor driver
      - thinkfan-tui          # TUI for ThinkPad fan control (waybar fan module)
      - ufw-docker            # ufw rules that survive docker's iptables games
      - picotool              # flash / inspect RP2040 UF2s without the drag-and-drop dance

  tasks:
    # ── Bootstrap ──────────────────────────────────────────────
    - name: Check if private config exists
      stat:
        path: "{{ private_config_file }}"
      register: private_config_stat

    - name: Load private configuration
      include_vars: "{{ private_config_file }}"
      when: private_config_stat.stat.exists

    - name: Set private config loaded flag
      set_fact:
        private_config_loaded: "{{ private_config_stat.stat.exists | default(false) }}"

    - name: Display execution context
      debug:
        msg: |
          Running as: {{ ansible_facts['user_id'] }}
          Target user: {{ target_user }}
          Target home: {{ target_home }}
          Root execution: {{ running_as_root }}
          Private config loaded: {{ private_config_loaded }}

    - name: Create backup directory with timestamp
      set_fact:
        backup_dir: "{{ dotfiles_dir }}/backups/{{ ansible_facts['date_time'].epoch }}"

    - name: Ensure backup directory exists
      file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'
        owner: "{{ target_user }}"
        group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else target_user }}"

    - name: Display setup mode
      debug:
        msg: "Setting up {{ hostname }} as {{ 'PERSONAL MACHINE (Arch Linux - full configs)' if is_personal_machine else ('SERVER (Debian - shell, neovim, dev toolchain)' if is_server_machine else 'WORK MACHINE (macOS - limited configs)') }}"

    - name: Clean up broken symlinks in .config
      shell: |
        CONFIG_DIR="{{ config_dir }}"
        [ -d "$CONFIG_DIR" ] || exit 0
        find "$CONFIG_DIR" -type l ! -exec test -e {} \; -print -delete
      register: cleaned_links
      changed_when: cleaned_links.stdout != ""
      become: no

    - name: Show cleaned broken links
      debug:
        msg: "Cleaned broken links: {{ cleaned_links.stdout_lines }}"
      when: cleaned_links.stdout != ""

    # ── Task includes ──────────────────────────────────────────
    - name: Install packages
      include_tasks: tasks/packages.yml

    - name: Setup shell (zsh, oh-my-zsh, .zshrc)
      include_tasks: tasks/shell.yml

    - name: Setup dotfile symlinks
      include_tasks: tasks/dotfiles.yml

    - name: Setup desktop environment
      include_tasks: tasks/desktop.yml
      when: is_personal_machine

    - name: Setup barbatos hardware (NVIDIA, fingerprint, ThinkPad, network)
      include_tasks: tasks/barbatos.yml
      when: hostname == 'barbatos'

    - name: Setup development tools
      include_tasks: tasks/devtools.yml

    - name: Setup Claude Code
      include_tasks: tasks/claude.yml
      when: not is_server_machine

    # ── Cleanup ────────────────────────────────────────────────
    - name: Show backup summary
      block:
        - name: Check if any backups were created
          find:
            paths: "{{ backup_dir }}"
            file_type: any
          register: backup_contents

        - name: Display backup information
          debug:
            msg: |
              Backup Summary:
              ==============
              Backup directory: {{ backup_dir }}
              Files backed up: {{ backup_contents.files | length }}

              {% if backup_contents.files | length > 0 %}
              Backed up items:
              {% for item in backup_contents.files %}
              - {{ item.path | basename }}
              {% endfor %}

              Review these backups and delete the backup directory when satisfied.
              {% else %}
              No existing configs needed backing up.
              {% endif %}
          when: backup_contents is defined

    - name: Fix ownership of all config files
      block:
        - name: Ensure all config files are owned by target user
          file:
            path: "{{ config_dir }}"
            state: directory
            recurse: yes
            owner: "{{ target_user }}"
            group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else target_user }}"
          when: running_as_root

        - name: Ensure home directory files are owned by target user
          file:
            path: "{{ item }}"
            owner: "{{ target_user }}"
            group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else target_user }}"
          loop:
            - "{{ target_home }}/.zshrc"
            - "{{ target_home }}/.tmux.conf"
            - "{{ target_home }}/.gitconfig"
          when: running_as_root
          ignore_errors: yes

        - name: Fix oh-my-zsh ownership
          file:
            path: "{{ oh_my_zsh_dir }}"
            state: directory
            recurse: yes
            owner: "{{ target_user }}"
            group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else target_user }}"
          when:
            - running_as_root
            - oh_my_zsh_installed.stat.exists
