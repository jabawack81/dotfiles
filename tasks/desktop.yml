---
# Desktop environment — Hyprland, waybar, GTK, bedtime, per-machine extras

- name: Setup Hyprland with clean symlink structure
  block:
    - name: Check existing hypr directories
      stat:
        path: "{{ item }}"
      register: hypr_checks
      loop:
        - "{{ config_dir }}/hypr"
        - "{{ config_dir }}/hypr_common"

    - name: Backup old hypr setup if needed
      command: mv "{{ config_dir }}/hypr" "{{ backup_dir }}/hypr-old-backup"
      when:
        - hypr_checks.results[0].stat.exists
        - not hypr_checks.results[0].stat.islnk

    # A real directory was moved to the backup above; a symlink pointing
    # elsewhere is overwritten by `force: yes` below. Only a leftover real
    # hypr_common directory needs clearing here.
    - name: Remove a real hypr_common directory
      file:
        path: "{{ config_dir }}/hypr_common"
        state: absent
      when:
        - is_personal_machine
        - hypr_checks.results[1].stat.exists
        - not hypr_checks.results[1].stat.islnk

    - name: Create hypr symlink to machine-specific directory
      file:
        src: "{{ dotfiles_dir }}/{{ hostname }}/hypr"
        dest: "{{ config_dir }}/hypr"
        state: link
        force: yes
        owner: "{{ target_user }}"
        group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else target_user }}"
      when: is_personal_machine

    - name: Create hypr_common symlink to common directory
      file:
        src: "{{ dotfiles_dir }}/common/hypr"
        dest: "{{ config_dir }}/hypr_common"
        state: link
        force: yes
        owner: "{{ target_user }}"
        group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else target_user }}"
      when: is_personal_machine

- name: Setup greetd + regreet as display manager (shinkiro only)
  block:
    - name: Install greetd configs from dotfiles
      copy:
        src: "{{ dotfiles_dir }}/shinkiro/greetd/{{ item }}"
        dest: "/etc/greetd/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - config.toml
        - regreet.toml
        - regreet.css

    - name: Seed greeter wallpaper from Hyprland defaults
      copy:
        src: /usr/share/hypr/wall2.png
        dest: /etc/greetd/wallpaper.png
        owner: root
        group: root
        mode: '0644'
        remote_src: yes

    - name: Ensure regreet state directory exists
      file:
        path: /var/lib/regreet
        state: directory
        owner: greeter
        group: greeter
        mode: '0755'

    - name: Pre-seed regreet state so Hyprland is the default session
      copy:
        dest: /var/lib/regreet/state.toml
        content: |
          last_user = "{{ target_user }}"

          [user_to_last_sess]
          {{ target_user }} = "Hyprland"
        owner: greeter
        group: greeter
        mode: '0644'
        force: no   # don't overwrite if regreet has already written the user's real picks

    - name: Disable sddm (greetd replaces it)
      systemd:
        name: sddm.service
        enabled: no
      ignore_errors: yes   # sddm may not be installed on fresh machines

    - name: Enable greetd as the display manager
      systemd:
        name: greetd.service
        enabled: yes
  become: yes
  when:
    - is_personal_machine
    - hostname == 'shinkiro'

# Every personal machine gets the wallpaper directory: caelestia's
# paths.wallpaperDir points at it and its wallpaper switcher reads from
# there. Only the cycling timer below is desktop-specific.
- name: Setup the wallpaper directory
  block:
    - name: Ensure ~/Pictures/wallpapers exists
      file:
        path: "{{ target_home }}/Pictures/wallpapers"
        state: directory
        mode: '0755'
        owner: "{{ target_user }}"
        group: "{{ target_user }}"

    - name: Seed wallpapers with Hyprland defaults (skips if already present)
      copy:
        src: "/usr/share/hypr/{{ item }}"
        dest: "{{ target_home }}/Pictures/wallpapers/{{ item }}"
        force: no
        mode: '0644'
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
      loop:
        - wall0.png
        - wall1.png
        - wall2.png
      ignore_errors: yes   # /usr/share/hypr only exists once hyprland is installed
  when: is_personal_machine

- name: Setup wallpaper cycling (shinkiro only)
  block:
    - name: Ensure ~/.local/bin exists
      file:
        path: "{{ target_home }}/.local/bin"
        state: directory
        mode: '0755'
        owner: "{{ target_user }}"
        group: "{{ target_user }}"

    - name: Symlink cycle-wallpaper.sh into ~/.local/bin
      file:
        src: "{{ dotfiles_dir }}/common/wallpaper/cycle-wallpaper.sh"
        dest: "{{ target_home }}/.local/bin/cycle-wallpaper.sh"
        state: link
        force: yes
        owner: "{{ target_user }}"
        group: "{{ target_user }}"

    - name: Ensure cycle-wallpaper.sh is executable
      file:
        path: "{{ dotfiles_dir }}/common/wallpaper/cycle-wallpaper.sh"
        mode: '0755'

    - name: Ensure systemd user directory exists
      file:
        path: "{{ target_home }}/.config/systemd/user"
        state: directory
        mode: '0755'
        owner: "{{ target_user }}"
        group: "{{ target_user }}"

    - name: Install wallpaper-cycle systemd user units
      file:
        src: "{{ dotfiles_dir }}/common/wallpaper/{{ item }}"
        dest: "{{ target_home }}/.config/systemd/user/{{ item }}"
        state: link
        force: yes
      loop:
        - wallpaper-cycle.service
        - wallpaper-cycle.timer

    - name: Enable + start wallpaper-cycle.timer
      systemd:
        name: wallpaper-cycle.timer
        enabled: yes
        state: started
        daemon_reload: yes
        scope: user
      when: not running_as_root
      ignore_errors: yes
  when:
    - is_personal_machine
    - hostname == 'shinkiro'

- name: Ensure gtk-3.0 directory exists
  file:
    path: "{{ config_dir }}/gtk-3.0"
    state: directory
    mode: '0755'
  when: is_personal_machine

- name: Link GTK3 CSS for system-wide theming
  file:
    src: "{{ dotfiles_dir }}/common/thunar/gtk.css"
    dest: "{{ config_dir }}/gtk-3.0/gtk.css"
    state: link
    force: yes
  when: is_personal_machine

- name: Ensure Thunar directory exists (capital T)
  file:
    path: "{{ config_dir }}/Thunar"
    state: directory
    mode: '0755'
  when: is_personal_machine

- name: Link GTK files to Thunar directory
  file:
    src: "{{ dotfiles_dir }}/common/thunar/{{ item }}"
    dest: "{{ config_dir }}/Thunar/{{ item }}"
    state: link
    force: yes
  loop:
    - gtk.css
    - gtkrc-2.0
  when: is_personal_machine

- name: Setup Waybar with clean symlink structure
  block:
    - name: Check existing waybar directories
      stat:
        path: "{{ item }}"
      register: waybar_checks
      loop:
        - "{{ config_dir }}/waybar"
        - "{{ config_dir }}/waybar_common"

    - name: Backup old waybar setup if needed
      command: mv "{{ config_dir }}/waybar" "{{ backup_dir }}/waybar-old-backup"
      when:
        - waybar_checks.results[0].stat.exists
        - not waybar_checks.results[0].stat.islnk

    - name: Remove a real waybar_common directory
      file:
        path: "{{ config_dir }}/waybar_common"
        state: absent
      when:
        - is_personal_machine
        - waybar_checks.results[1].stat.exists
        - not waybar_checks.results[1].stat.islnk

    - name: Create waybar symlink to machine-specific directory
      file:
        src: "{{ dotfiles_dir }}/{{ hostname }}/waybar"
        dest: "{{ config_dir }}/waybar"
        state: link
        force: yes
        owner: "{{ target_user }}"
        group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else target_user }}"
      when: is_personal_machine

    - name: Create waybar_common symlink to common directory
      file:
        src: "{{ dotfiles_dir }}/common/waybar"
        dest: "{{ config_dir }}/waybar_common"
        state: link
        force: yes
        owner: "{{ target_user }}"
        group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else target_user }}"
      when: is_personal_machine

- name: Setup bedtime reminder system
  block:
    - name: Check existing bedtime directory
      stat:
        path: "{{ config_dir }}/bedtime"
      register: bedtime_stat

    - name: Remove old bedtime directory if it is a real directory
      file:
        path: "{{ config_dir }}/bedtime"
        state: absent
      when: bedtime_stat.stat.exists and not bedtime_stat.stat.islnk

    - name: Symlink bedtime directory
      file:
        src: "{{ dotfiles_dir }}/common/bedtime"
        dest: "{{ config_dir }}/bedtime"
        state: link
        force: yes
        owner: "{{ target_user }}"
        group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else target_user }}"

    - name: Create systemd user directory
      file:
        path: "{{ ansible_facts['env'].HOME }}/.config/systemd/user"
        state: directory
        mode: '0755'

    - name: Install bedtime systemd files
      file:
        src: "{{ dotfiles_dir }}/common/bedtime/{{ item }}"
        dest: "{{ ansible_facts['env'].HOME }}/.config/systemd/user/{{ item }}"
        state: link
        force: yes
      loop:
        - bedtime-reminder.service
        - bedtime-reminder.timer

    - name: Enable bedtime reminder timer (when not root)
      systemd:
        name: bedtime-reminder.timer
        enabled: yes
        daemon_reload: yes
        scope: user
      when: not running_as_root
      ignore_errors: yes

    - name: Check if bedtime timer is already enabled
      stat:
        path: "{{ target_home }}/.config/systemd/user/timers.target.wants/bedtime-reminder.timer"
      register: bedtime_timer_enabled

    - name: Enable bedtime reminder timer as target user (when root)
      shell: |
        echo "Note: Cannot enable user systemd services when running as root."
        echo "Please run as your user: systemctl --user enable --now bedtime-reminder.timer"
      when:
        - running_as_root
        - not bedtime_timer_enabled.stat.exists

    - name: Show bedtime timer status
      debug:
        msg: |
          {% if bedtime_timer_enabled.stat.exists %}
          Bedtime reminder timer is already enabled
          {% else %}
          To enable bedtime timer, run as your user (not root):
          systemctl --user enable --now bedtime-reminder.timer
          {% endif %}
  when: is_personal_machine

- name: Configure fingerprint authentication on kyrios
  block:
    - name: Install fingerprint packages
      pacman:
        name:
          - fprintd
          - libfprint
        state: present

    - name: Create fingerprint setup instructions
      copy:
        dest: "{{ ansible_facts['env'].HOME }}/fingerprint-setup-instructions.txt"
        content: |
          ThinkPad T460s Fingerprint Setup Instructions
          =============================================

          Your fingerprint reader (Validity Sensors VFS7500) has been detected.

          To enable fingerprint authentication:

          1. Configure PAM for fingerprint support:
             sudo sed -i '3i auth       sufficient                  pam_fprintd.so' /etc/pam.d/system-auth

          2. Enroll your fingerprints:
             fprintd-enroll -f right-index-finger
             fprintd-enroll -f left-index-finger

          3. Test with sudo:
             sudo echo "Fingerprint test"

          4. For 1Password:
             - Open 1Password preferences
             - Go to Security settings
             - Enable "Unlock with system authentication"

          Note: Always have a password backup in case fingerprint fails!
        owner: "{{ target_user }}"
        group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else target_user }}"
        mode: '0644'
  when: hostname == 'kyrios'

# quickshell-git links Qt's private API, so every qt6 upgrade can break it with
# a symbol lookup error. The only visible symptom is the status bar quietly
# falling back to waybar, often days later — these two make it loud instead.
# The shell is vendored, so the plugin has to be compiled on each machine.
# It is built inside the repo and loaded via QML_IMPORT_PATH by
# bar-launcher.sh, so nothing is installed system-wide and no root is needed.
- name: Build the vendored caelestia QML plugin
  when: is_personal_machine
  block:
    - name: Check whether the caelestia plugin is already built
      stat:
        path: "{{ dotfiles_dir }}/common/caelestia-shell/build/qml/Caelestia/libcaelestia-coreplugin.so"
      register: caelestia_plugin

    - name: Build the caelestia plugin
      command: make caelestia-build
      args:
        chdir: "{{ dotfiles_dir }}"
      when: not caelestia_plugin.stat.exists
      become: no
      register: caelestia_build
      # A build failure should not take the rest of the run down; the
      # launcher falls back to waybar and says why.
      ignore_errors: yes

    - name: Report a failed caelestia build
      debug:
        msg: >-
          The caelestia plugin failed to build, so that bar option will fall
          back to waybar. Run `make caelestia-build` by hand to see why.
      when: caelestia_build is defined and caelestia_build is failed

# The chosen scheme lives in caelestia's runtime state, not in its config,
# so a fresh machine comes up on the default until it is set once. The
# shell.json in common/caelestia turns smartScheme off so that changing the
# wallpaper does not re-derive a palette and discard this.
- name: Set the caelestia colour scheme
  when: is_personal_machine
  block:
    - name: Read the current caelestia scheme
      command: cat "{{ target_home }}/.local/state/caelestia/scheme.json"
      register: caelestia_scheme_state
      changed_when: false
      failed_when: false
      check_mode: no

    - name: Apply the configured scheme
      command: caelestia scheme set -n {{ caelestia_scheme }} -f {{ caelestia_scheme_flavour }} -m dark
      become: no
      when: (caelestia_scheme_state.stdout | default('') | from_json).name | default('') != caelestia_scheme
      # Needs the shell's D-Bus session; harmless to skip during a headless run
      ignore_errors: yes

- name: Install quickshell Qt6 compatibility check script
  copy:
    src: "{{ dotfiles_dir }}/common/scripts/quickshell-qt6-check.sh"
    dest: /usr/local/bin/quickshell-qt6-check
    mode: '0755'
    owner: root
    group: root
  become: "{{ not running_as_root }}"

- name: Ensure the pacman hooks directory exists (absent on fresh installs)
  file:
    path: /etc/pacman.d/hooks
    state: directory
    mode: '0755'
    owner: root
    group: root
  become: "{{ not running_as_root }}"

- name: Install pacman hook to flag quickshell breakage after Qt6 upgrades
  copy:
    src: "{{ dotfiles_dir }}/pacman-hooks/50-quickshell-qt6.hook"
    dest: /etc/pacman.d/hooks/50-quickshell-qt6.hook
    mode: '0644'
    owner: root
    group: root
  become: "{{ not running_as_root }}"
