---
# Development tools — Git, GitHub CLI, rbenv, nodenv, SDKMAN, Go

- name: Setup broot file browser
  block:
    - name: Check existing broot config
      stat:
        path: "{{ config_dir }}/broot"
      register: broot_stat

    - name: Remove old broot config if it is a real directory
      file:
        path: "{{ config_dir }}/broot"
        state: absent
      when: broot_stat.stat.exists and not broot_stat.stat.islnk

    - name: Symlink broot directory
      file:
        src: "{{ dotfiles_dir }}/common/broot"
        dest: "{{ config_dir }}/broot"
        state: link
        force: yes
        owner: "{{ target_user }}"
        group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else target_user }}"

    - name: Create broot skins directory if missing
      file:
        path: "{{ dotfiles_dir }}/common/broot/skins"
        state: directory
        mode: '0755'

- name: Setup lazygit configuration
  block:
    - name: Check existing lazygit config
      stat:
        path: "{{ config_dir }}/lazygit"
      register: lazygit_stat

    - name: Remove old lazygit config if it is a real directory
      file:
        path: "{{ config_dir }}/lazygit"
        state: absent
      when: lazygit_stat.stat.exists and not lazygit_stat.stat.islnk

    - name: Symlink lazygit directory
      file:
        src: "{{ dotfiles_dir }}/common/lazygit"
        dest: "{{ config_dir }}/lazygit"
        state: link
        force: yes
        owner: "{{ target_user }}"
        group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else target_user }}"

- name: Configure GitHub CLI with 1Password (all machines)
  block:
    - name: Check if gh is installed
      command: which gh
      register: gh_installed
      failed_when: false
      changed_when: false

    - name: Check if op (1Password CLI) is installed
      command: which op
      register: op_installed
      failed_when: false
      changed_when: false

    - name: Ensure gh config directory exists
      file:
        path: "{{ ansible_facts['env'].HOME }}/.config/gh"
        state: directory
        mode: '0755'
      when:
        - gh_installed.rc == 0
        - op_installed.rc == 0

    - name: Read gh git protocol
      command: gh config get git_protocol --host github.com
      register: gh_protocol
      changed_when: false
      failed_when: false
      when:
        - gh_installed.rc == 0
        - op_installed.rc == 0

    - name: Configure gh to use SSH protocol
      command: gh config set git_protocol ssh --host github.com
      when:
        - gh_installed.rc == 0
        - op_installed.rc == 0
        - gh_protocol.stdout | default('') | trim != 'ssh'

    - name: Create gh hosts.yml for 1Password integration
      copy:
        content: |
          github.com:
            user: {{ ansible_facts['user_id'] }}
            git_protocol: ssh
            oauth_token: op://Personal/GitHub Personal Access Token/credential
        dest: "{{ ansible_facts['env'].HOME }}/.config/gh/hosts.yml"
        mode: '0600'
      when:
        - gh_installed.rc == 0
        - op_installed.rc == 0

    - name: Show 1Password CLI installation instructions
      debug:
        msg: |
          1Password CLI not found. To integrate gh with 1Password:

          Personal machines (Arch):
          yay -S 1password-cli

          Work machines (macOS):
          brew install 1password-cli

          Note: On personal machines, 1password-cli is installed automatically via AUR

          After installation:
          1. Run: op signin
          2. Create a GitHub Personal Access Token in 1Password named "GitHub Personal Access Token"
          3. Run the playbook again
      when:
        - gh_installed.rc == 0
        - op_installed.rc != 0

- name: Configure Git with 1Password SSH signing (all machines)
  block:
    # private-config supplies the work identity on work machines; personal
    # machines and servers use the public one.
    - name: Set Git user name
      git_config:
        name: user.name
        value: "{{ git_user_name | default('Paolo Fabbri') }}"
        scope: global

    - name: Set Git user email
      git_config:
        name: user.email
        value: "{{ git_user_email if (not is_personal_machine and not is_server_machine and git_user_email is defined) else 'jabawack81@gmail.com' }}"
        scope: global

    - name: Set default branch to main
      git_config:
        name: init.defaultbranch
        value: "main"
        scope: global

    - name: Check if 1Password is available for SSH signing
      stat:
        path: /opt/1Password/op-ssh-sign
      register: op_ssh_sign
      when: is_personal_machine

    - name: Check if 1Password app is available for SSH signing (macOS)
      stat:
        path: "/Applications/1Password.app/Contents/MacOS/op-ssh-sign"
      register: op_ssh_sign_mac
      when: not is_personal_machine

    - name: Configure Git to use SSH signing with 1Password (Linux)
      block:
        - name: Enable commit signing
          git_config:
            name: commit.gpgsign
            value: "true"
            scope: global

        - name: Set GPG format to SSH
          git_config:
            name: gpg.format
            value: "ssh"
            scope: global

        - name: Set SSH signing program
          git_config:
            name: gpg.ssh.program
            value: "/opt/1Password/op-ssh-sign"
            scope: global

        - name: Set SSH signing key
          git_config:
            name: user.signingkey
            value: "{{ ssh_signing_key }}"
            scope: global

        - name: Set global gitignore
          git_config:
            name: core.excludesfile
            value: "{{ ansible_facts['env'].HOME }}/dotfiles/common/git/ignore"
            scope: global
      when:
        - is_personal_machine
        - op_ssh_sign.stat.exists

    - name: Configure Git to use SSH signing with 1Password (macOS)
      block:
        - name: Enable commit signing
          git_config:
            name: commit.gpgsign
            value: "true"
            scope: global

        - name: Set GPG format to SSH
          git_config:
            name: gpg.format
            value: "ssh"
            scope: global

        - name: Set SSH signing program
          git_config:
            name: gpg.ssh.program
            value: "/Applications/1Password.app/Contents/MacOS/op-ssh-sign"
            scope: global

        - name: Set SSH signing key
          git_config:
            name: user.signingkey
            value: "{{ ssh_signing_key }}"
            scope: global

        - name: Set global gitignore
          git_config:
            name: core.excludesfile
            value: "{{ ansible_facts['env'].HOME }}/dotfiles/common/git/ignore"
            scope: global
      when:
        - not is_personal_machine
        - op_ssh_sign_mac.stat.exists

    # Without an allowed signers file git can sign but cannot verify, so
    # `git log --show-signature` reports "No signature" on commits it just
    # made itself. The file maps a principal to the key that may sign for it;
    # one line for this machine's own identity is enough.
    - name: Ensure the git config directory exists
      file:
        path: "{{ ansible_facts['env'].HOME }}/.config/git"
        state: directory
        mode: '0755'
      when: ssh_signing_key is defined

    - name: Write the allowed signers file
      copy:
        dest: "{{ ansible_facts['env'].HOME }}/.config/git/allowed_signers"
        content: |
          {{ git_user_email if not is_personal_machine else 'jabawack81@gmail.com' }} {{ ssh_signing_key }}
        mode: '0644'
      when: ssh_signing_key is defined

    - name: Point git at the allowed signers file
      git_config:
        name: gpg.ssh.allowedSignersFile
        value: "{{ ansible_facts['env'].HOME }}/.config/git/allowed_signers"
        scope: global
      when: ssh_signing_key is defined

    - name: Show SSH key setup instructions
      debug:
        msg: |
          Git is configured! To complete SSH signing setup:

          1. Add your SSH key to GitHub:
             - Go to GitHub Settings > SSH and GPG keys
             - Add the same SSH key as a signing key

          2. Make sure your SSH key is in 1Password and available to the SSH agent

          3. Test signing with: git commit -S -m "test" --allow-empty
      when: (is_personal_machine and op_ssh_sign is defined and op_ssh_sign.stat.exists) or (not is_personal_machine and op_ssh_sign_mac is defined and op_ssh_sign_mac.stat.exists)

# Plain git diffs: no external pager. git-delta used to be configured here;
# these tasks unset it on machines that still carry the old settings.
- name: Configure git diff output
  block:
    - name: Remove git-delta pager and filter settings
      git_config:
        name: "{{ item }}"
        scope: global
        state: absent
      loop:
        - core.pager
        - interactive.diffFilter
        - delta.navigate
        - delta.light
        - delta.side-by-side
        - delta.syntax-theme
        - delta.line-numbers
        - delta.file-style
        - delta.file-decoration-style
        - delta.hunk-header-style
        - delta.hunk-header-decoration-style
        - delta.minus-style
        - delta.minus-emph-style
        - delta.plus-style
        - delta.plus-emph-style

    - name: Set merge conflict style
      git_config:
        name: merge.conflictstyle
        value: "diff3"
        scope: global

    - name: Enable color moved detection
      git_config:
        name: diff.colorMoved
        value: "default"
        scope: global

- name: Install and configure development version managers (all machines)
  block:
    - name: Check if rbenv is installed
      stat:
        path: "{{ ansible_facts['env'].HOME }}/.rbenv"
      register: rbenv_installed

    - name: Clone rbenv
      git:
        repo: https://github.com/rbenv/rbenv.git
        dest: "{{ ansible_facts['env'].HOME }}/.rbenv"
        update: no
      when: not rbenv_installed.stat.exists
      become: "{{ running_as_root }}"
      become_user: "{{ target_user if running_as_root else omit }}"

    - name: Check if ruby-build is installed
      stat:
        path: "{{ ansible_facts['env'].HOME }}/.rbenv/plugins/ruby-build"
      register: ruby_build_installed

    - name: Clone ruby-build for rbenv
      git:
        repo: https://github.com/rbenv/ruby-build.git
        dest: "{{ ansible_facts['env'].HOME }}/.rbenv/plugins/ruby-build"
        update: no
      when: not ruby_build_installed.stat.exists
      become: "{{ running_as_root }}"
      become_user: "{{ target_user if running_as_root else omit }}"

    - name: Check if rbenv-default-gems is installed
      stat:
        path: "{{ ansible_facts['env'].HOME }}/.rbenv/plugins/rbenv-default-gems"
      register: rbenv_default_gems_installed

    - name: Clone rbenv-default-gems plugin
      git:
        repo: https://github.com/rbenv/rbenv-default-gems.git
        dest: "{{ ansible_facts['env'].HOME }}/.rbenv/plugins/rbenv-default-gems"
        update: no
      when: not rbenv_default_gems_installed.stat.exists
      become: "{{ running_as_root }}"
      become_user: "{{ target_user if running_as_root else omit }}"

    - name: Link default-gems configuration
      file:
        src: "{{ dotfiles_dir }}/common/rbenv/default-gems"
        dest: "{{ ansible_facts['env'].HOME }}/.rbenv/default-gems"
        state: link
        force: yes
        owner: "{{ target_user }}"
        group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else target_user }}"
      become: "{{ running_as_root }}"
      become_user: "{{ target_user if running_as_root else omit }}"

    # Migration from the days before the managed block: drop a hand-written
    # init line, but only one that is NOT the copy inside our own block
    # (otherwise this and "Add nodenv to .zshrc" undo each other every run).
    - name: Clean up manual nodenv entry from .zshrc
      replace:
        path: "{{ ansible_facts['env'].HOME }}/.zshrc"
        regexp: '(?<!export PATH="\$HOME/.nodenv/bin:\$PATH"\n)^eval "\$\(nodenv init - zsh\)"\n'
        replace: ''

    - name: Check if nodenv is installed
      stat:
        path: "{{ ansible_facts['env'].HOME }}/.nodenv"
      register: nodenv_installed

    - name: Clone nodenv
      git:
        repo: https://github.com/nodenv/nodenv.git
        dest: "{{ ansible_facts['env'].HOME }}/.nodenv"
        update: no
      when: not nodenv_installed.stat.exists
      become: "{{ running_as_root }}"
      become_user: "{{ target_user if running_as_root else omit }}"

    - name: Check if node-build is installed
      stat:
        path: "{{ ansible_facts['env'].HOME }}/.nodenv/plugins/node-build"
      register: node_build_installed
      when: nodenv_installed.stat.exists or not nodenv_installed.stat.exists

    - name: Clone node-build for nodenv
      git:
        repo: https://github.com/nodenv/node-build.git
        dest: "{{ ansible_facts['env'].HOME }}/.nodenv/plugins/node-build"
        update: no
      when: not node_build_installed.stat.exists
      become: "{{ running_as_root }}"
      become_user: "{{ target_user if running_as_root else omit }}"

    - name: Check if nodenv-default-packages is installed
      stat:
        path: "{{ ansible_facts['env'].HOME }}/.nodenv/plugins/nodenv-default-packages"
      register: nodenv_default_packages_installed

    - name: Clone nodenv-default-packages plugin
      git:
        repo: https://github.com/nodenv/nodenv-default-packages.git
        dest: "{{ ansible_facts['env'].HOME }}/.nodenv/plugins/nodenv-default-packages"
        update: no
      when: not nodenv_default_packages_installed.stat.exists
      become: "{{ running_as_root }}"
      become_user: "{{ target_user if running_as_root else omit }}"

    - name: Link default-packages configuration
      file:
        src: "{{ dotfiles_dir }}/common/nodenv/default-packages"
        dest: "{{ ansible_facts['env'].HOME }}/.nodenv/default-packages"
        state: link
        force: yes
        owner: "{{ target_user }}"
        group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else target_user }}"
      become: "{{ running_as_root }}"
      become_user: "{{ target_user if running_as_root else omit }}"

    - name: Add rbenv to .zshrc
      blockinfile:
        path: "{{ ansible_facts['env'].HOME }}/.zshrc"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - rbenv"
        block: |
          # rbenv configuration
          export PATH="$HOME/.rbenv/bin:$PATH"
          eval "$(rbenv init - zsh)"

    - name: Add nodenv to .zshrc
      blockinfile:
        path: "{{ ansible_facts['env'].HOME }}/.zshrc"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - nodenv"
        block: |
          # nodenv configuration
          export PATH="$HOME/.nodenv/bin:$PATH"
          eval "$(nodenv init - zsh)"

    - name: Check if Ruby is installed
      shell: |
        if [ -d "{{ ansible_facts['env'].HOME }}/.rbenv/versions" ] && [ "$(ls -A {{ ansible_facts['env'].HOME }}/.rbenv/versions 2>/dev/null)" ]; then
          echo "installed"
        else
          echo "none"
        fi
      register: ruby_installed
      changed_when: false

    # No `rbenv init` here: it emits bash-only `source` lines that break under
    # Debian's /bin/sh (dash); `rbenv install`/`global` only need PATH. Same
    # for nodenv below.
    - name: Install latest stable Ruby
      shell: |
        set -euo pipefail
        export PATH="{{ ansible_facts['env'].HOME }}/.rbenv/bin:$PATH"
        LATEST_RUBY=$(rbenv install -l 2>/dev/null | grep -E "^[0-9]+\.[0-9]+\.[0-9]+$" | tail -1)
        [ -n "$LATEST_RUBY" ] || { echo "no Ruby version found in ruby-build" >&2; exit 1; }
        rbenv install -s "$LATEST_RUBY"
        rbenv global "$LATEST_RUBY"
      args:
        executable: /bin/bash
      when: ruby_installed.stdout == "none"

    - name: Check if Node is installed
      shell: |
        if [ -d "{{ ansible_facts['env'].HOME }}/.nodenv/versions" ] && [ "$(ls -A {{ ansible_facts['env'].HOME }}/.nodenv/versions 2>/dev/null)" ]; then
          echo "installed"
        else
          echo "none"
        fi
      register: node_installed
      changed_when: false

    # LTS lines are the even majors; pick the newest one node-build lists.
    # A hardcoded major went stale once (20.x dropped from the list) and the
    # task then installed nothing while still reporting success, hence set -e
    # and the explicit empty check.
    - name: Install latest stable Node (LTS)
      shell: |
        set -e
        export PATH="{{ ansible_facts['env'].HOME }}/.nodenv/bin:$PATH"
        LATEST_NODE=$(nodenv install -l 2>/dev/null | grep -E "^[0-9]+\.[0-9]+\.[0-9]+$" | awk -F. "\$1 % 2 == 0" | tail -1)
        [ -n "$LATEST_NODE" ] || { echo "no even-major Node version found in nodenv install -l" >&2; exit 1; }
        nodenv install -s "$LATEST_NODE"
        nodenv global "$LATEST_NODE"
      when: node_installed.stdout == "none"

    - name: Fix rbenv ownership when running as root
      file:
        path: "{{ ansible_facts['env'].HOME }}/.rbenv"
        state: directory
        recurse: yes
        owner: "{{ target_user }}"
        group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else target_user }}"
      when: running_as_root

    - name: Fix nodenv ownership when running as root
      file:
        path: "{{ ansible_facts['env'].HOME }}/.nodenv"
        state: directory
        recurse: yes
        owner: "{{ target_user }}"
        group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else target_user }}"
      when: running_as_root

    - name: Show version manager setup instructions
      debug:
        msg: |
          Version managers and languages installed!

          Ruby: {{ ruby_installed.stdout | default('Installing latest stable version') }}
          Node: {{ node_installed.stdout | default('Installing latest LTS version') }}

          To manage versions:
          - rbenv versions / nodenv versions - List installed versions

- name: Install SDKMAN and Go version manager
  block:
    # Same migration idea as the nodenv one: strip a hand-written SDKMAN
    # stanza, but never the one sitting inside our managed block.
    - name: Clean up manual SDKMAN entries from .zshrc
      replace:
        path: "{{ ansible_facts['env'].HOME }}/.zshrc"
        regexp: '(?<!# BEGIN ANSIBLE MANAGED BLOCK - sdkman\n)#THIS MUST BE AT THE END[^#]+\[\[ -s[^]]+\]\] && source[^\n]+\n'
        replace: ''

    - name: Check if SDKMAN is installed
      stat:
        path: "{{ ansible_facts['env'].HOME }}/.sdkman"
      register: sdkman_installed

    - name: Install SDKMAN (JVM version manager)
      shell: |
        curl -s "https://get.sdkman.io" | bash
      args:
        creates: "{{ ansible_facts['env'].HOME }}/.sdkman"
      when: not sdkman_installed.stat.exists

    - name: Fix SDKMAN permissions
      file:
        path: "{{ ansible_facts['env'].HOME }}/.sdkman"
        state: directory
        recurse: yes
        owner: "{{ target_user }}"
        group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else target_user }}"
      when:
        - sdkman_installed.stat.exists or not sdkman_installed.stat.exists
        - running_as_root

    - name: Add SDKMAN to .zshrc
      blockinfile:
        path: "{{ ansible_facts['env'].HOME }}/.zshrc"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - sdkman"
        insertafter: EOF
        block: |
          #THIS MUST BE AT THE END OF THE FILE FOR SDKMAN TO WORK!!!
          export SDKMAN_DIR="$HOME/.sdkman"
          [[ -s "$HOME/.sdkman/bin/sdkman-init.sh" ]] && source "$HOME/.sdkman/bin/sdkman-init.sh"

    - name: Check if g (Go version manager) is installed
      stat:
        path: "{{ ansible_facts['env'].HOME }}/go/bin/g"
      register: g_installed

    - name: Install g (Go version manager)
      shell: |
        curl -sSL https://git.io/g-install | sh -s -- -y
      when: not g_installed.stat.exists

# tmux: the config's last line is `run '~/.tmux/plugins/tpm/tpm'`, so without
# the plugin manager checked out tmux starts with none of the plugins (and no
# nord theme). Used to be a manual step in the README.
- name: Setup tmux plugins (tpm)
  when: not is_server_machine
  block:
    - name: Check if tpm is installed
      stat:
        path: "{{ ansible_facts['env'].HOME }}/.tmux/plugins/tpm"
      register: tpm_installed

    - name: Clone tpm (tmux plugin manager)
      git:
        repo: https://github.com/tmux-plugins/tpm.git
        dest: "{{ ansible_facts['env'].HOME }}/.tmux/plugins/tpm"
        update: no
      when: not tpm_installed.stat.exists
      become: "{{ running_as_root }}"
      become_user: "{{ target_user if running_as_root else omit }}"

    - name: List the plugins the config asks for
      shell: |
        set -euo pipefail
        grep -oP "^set -g @plugin ['\"]\K[^'\"]+" "{{ dotfiles_dir }}/dot_tmux.conf" \
          | sed 's:.*/::'
      args:
        executable: /bin/bash
      register: tmux_wanted_plugins
      changed_when: false
      check_mode: no

    - name: Check which plugins are already checked out
      stat:
        path: "{{ ansible_facts['env'].HOME }}/.tmux/plugins/{{ item }}"
      register: tmux_plugin_stats
      loop: "{{ tmux_wanted_plugins.stdout_lines }}"

    # install_plugins needs TMUX_PLUGIN_MANAGER_PATH, which is only set once a
    # server has sourced the config. Running it inside a detached session gets
    # that for free whether or not a server is already up; the session ends
    # when the install finishes.
    - name: Install missing tmux plugins
      command: tmux new-session -d -s ansible-tpm-install "{{ ansible_facts['env'].HOME }}/.tmux/plugins/tpm/bin/install_plugins"
      when: tmux_plugin_stats.results | rejectattr('stat.exists') | list | length > 0
      become: "{{ running_as_root }}"
      become_user: "{{ target_user if running_as_root else omit }}"
