---
# Package installation — pacman, AUR, and machine-specific packages

# steam (in required_packages) lives in [multilib], which archinstall leaves
# commented out. Colour and parallel downloads are just nicer to look at.
- name: Configure pacman.conf (multilib, colour, parallel downloads)
  become: "{{ not running_as_root }}"
  when: is_personal_machine
  block:
    - name: Enable the multilib repository
      replace:
        path: /etc/pacman.conf
        regexp: '^#\[multilib\]\n#Include = /etc/pacman.d/mirrorlist'
        replace: "[multilib]\nInclude = /etc/pacman.d/mirrorlist"
      register: multilib_enabled

    - name: Set pacman options
      lineinfile:
        path: /etc/pacman.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        insertafter: '^\[options\]'
      loop:
        - { regexp: '^#?Color$',                 line: 'Color' }
        - { regexp: '^#?ILoveCandy$',            line: 'ILoveCandy' }
        - { regexp: '^#?ParallelDownloads = ',   line: 'ParallelDownloads = 5' }

    - name: Refresh package databases after enabling multilib
      pacman:
        update_cache: yes
      when: multilib_enabled.changed

# barbatos: archinstall's Hyprland profile picks nvidia-open, which does not
# support the Maxwell 940MX (the module never loads) and conflicts with the
# nvidia-580xx-* AUR packages. It has to go before required_packages, because
# steam needs a vulkan-driver / lib32-vulkan-driver provider and pacman will
# happily keep nvidia-utils around to satisfy that. Intel first, then remove.
- name: Swap the Vulkan providers from NVIDIA to Intel (barbatos)
  become: "{{ not running_as_root }}"
  when: hostname == 'barbatos'
  block:
    - name: Install the Intel Vulkan drivers
      pacman:
        name:
          - vulkan-intel
          - lib32-vulkan-intel
        state: present

    # -Qq resolves "provides", so once nvidia-580xx-utils is in this prints
    # its name rather than failing — compare the name, not the exit code.
    - name: Check for the stock nvidia-utils
      command: pacman -Qq nvidia-utils
      register: stock_nvidia_utils
      changed_when: false
      failed_when: false
      check_mode: no

    # nvidia-prime goes too while it's bound to the stock nvidia-utils; it
    # comes back from the AUR step once nvidia-580xx-utils is in place.
    - name: Remove nvidia-open in favour of the legacy 580xx branch
      pacman:
        name:
          - nvidia-prime
          - nvidia-open
          - nvidia-utils
          - lib32-nvidia-utils
        state: absent
      when: stock_nvidia_utils.stdout | trim == 'nvidia-utils'

- name: Ensure required packages are installed (Personal machines)
  pacman:
    name: "{{ item }}"
    state: present
  become: "{{ not running_as_root }}"
  loop: "{{ required_packages }}"
  when: is_personal_machine

- name: Skip package installation on work machines (macOS)
  debug:
    msg: |
      Skipping package installation on macOS. Please install these packages manually via Homebrew:

      Terminal apps:
      brew install ghostty neovim lazygit jq ripgrep fd fzf bat htop btop gh broot
      brew install anomalyco/tap/opencode

      GUI apps:
      brew install --cask firefox obsidian discord slack telegram

      Note: nvtop, grim, waybar, hyprland, etc. are Linux-only
  when:
    - not is_personal_machine
    - not is_server_machine

# ── Servers (Debian) ───────────────────────────────────────────
- name: Install server packages (apt)
  apt:
    name: "{{ server_packages }}"
    state: present
    update_cache: yes
    cache_valid_time: 3600
  become: "{{ not running_as_root }}"
  when: is_server_machine

# apt's neovim lags far behind what LazyVim requires, so install the official
# release tarball into /opt/nvim-<version> and point /opt/nvim at it.
#
# The tarball is staged inside the root-owned install directory, never /tmp:
# /tmp is world-writable, so a local user could plant an archive there and
# have it unpacked as root. get_url checks the pinned sha256 and re-downloads
# on mismatch, and --no-same-owner/--no-same-permissions means nothing in the
# archive can arrive as a root-owned setuid file.
- name: Install Neovim from the official release tarball
  when: is_server_machine
  become: "{{ not running_as_root }}"
  vars:
    neovim_install_dir: "/opt/nvim-{{ neovim_release }}"
    neovim_tarball: "{{ neovim_install_dir }}/nvim-linux-{{ neovim_arch }}.tar.gz"
  block:
    - name: Check for the pinned Neovim release in /opt
      stat:
        path: "{{ neovim_install_dir }}/nvim-linux-{{ neovim_arch }}/bin/nvim"
      register: nvim_release_bin

    - name: Create the Neovim install directory
      file:
        path: "{{ neovim_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Download the Neovim release tarball
      get_url:
        url: "https://github.com/neovim/neovim/releases/download/{{ neovim_release }}/nvim-linux-{{ neovim_arch }}.tar.gz"
        dest: "{{ neovim_tarball }}"
        checksum: "sha256:{{ neovim_sha256[neovim_arch] }}"
        owner: root
        group: root
        mode: '0600'
      when: not nvim_release_bin.stat.exists

    - name: Unpack Neovim
      unarchive:
        src: "{{ neovim_tarball }}"
        dest: "{{ neovim_install_dir }}"
        remote_src: yes
        extra_opts:
          - --no-same-owner
          - --no-same-permissions
      when: not nvim_release_bin.stat.exists

    - name: Remove the downloaded tarball
      file:
        path: "{{ neovim_tarball }}"
        state: absent

    - name: Point /opt/nvim at the pinned release
      file:
        src: "{{ neovim_install_dir }}/nvim-linux-{{ neovim_arch }}"
        dest: /opt/nvim
        state: link
        force: yes

    - name: Put nvim on PATH
      file:
        src: /opt/nvim/bin/nvim
        dest: /usr/local/bin/nvim
        state: link
        force: yes

- name: Check if yay is installed
  command: which yay
  register: yay_check
  ignore_errors: yes
  changed_when: false
  when: is_personal_machine

- name: Install yay dependencies
  pacman:
    name:
      - base-devel
      - git
    state: present
  become: "{{ not running_as_root }}"
  when:
    - is_personal_machine
    - yay_check.rc != 0

- name: Clone yay repository
  git:
    repo: https://aur.archlinux.org/yay.git
    dest: /tmp/yay
    force: yes
  when:
    - is_personal_machine
    - yay_check.rc != 0

- name: Build and install yay
  shell: |
    cd /tmp/yay
    makepkg -si --noconfirm
  args:
    creates: /usr/bin/yay
  when:
    - is_personal_machine
    - yay_check.rc != 0

- name: Install PipeWire audio compatibility layers
  pacman:
    name:
      - pipewire-pulse
      - pipewire-jack
    state: present
  become: "{{ not running_as_root }}"
  when: is_personal_machine

# yay refuses to run as root, so it escalates on its own via sudo. Running as a
# normal user under Ansible there is no tty for sudo to prompt on, and every
# failed attempt counts toward pam_faillock (deny=3) — which locked the account
# partway through the run and failed every become task after it.
#
# The password Ansible collects with -K is not exposed as a variable either
# (an askpass helper built from ansible_become_password never fired — it just
# printed "install by hand" on every run). So: work out what is actually
# missing, drop in a sudoers rule that lets yay run *pacman only* without a
# password for the duration of the block, and let a genuine build failure be
# visible.
#
# Machine-specific AUR packages (<hostname>_aur_packages) ride along here.
- name: Install AUR packages with yay
  when: is_personal_machine
  vars:
    aur_wanted: "{{ aur_packages + lookup('vars', hostname ~ '_aur_packages', default=[]) }}"
  block:
    - name: Check which AUR packages are already installed
      command: pacman -Qq {{ item | quote }}
      register: aur_query
      loop: "{{ aur_wanted }}"
      changed_when: false
      failed_when: false
      check_mode: no

    - name: Collect the missing AUR packages
      set_fact:
        aur_missing: "{{ aur_query.results | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}"

    - name: Install missing AUR packages
      when: aur_missing | length > 0
      block:
        - name: Temporarily let yay run pacman without a password
          copy:
            dest: /etc/sudoers.d/ansible-yay
            content: "{{ target_user }} ALL=(root) NOPASSWD: /usr/bin/pacman\n"
            mode: '0440'
            validate: 'visudo -cf %s'
          become: "{{ not running_as_root }}"

        - name: Install AUR packages with yay
          command: yay -S --noconfirm --norebuild --noredownload -- {{ item | quote }}
          loop: "{{ aur_missing }}"
          become: "{{ running_as_root }}"
          become_user: "{{ target_user if running_as_root else omit }}"
          register: yay_install
          # A single flaky AUR build should not abort the whole playbook, but
          # unlike `|| true` this still shows up in the recap as ignored.
          ignore_errors: yes
      always:
        - name: Remove the temporary yay sudoers rule
          file:
            path: /etc/sudoers.d/ansible-yay
            state: absent
          become: "{{ not running_as_root }}"

- name: Install shinkiro-specific packages (AMD GPU tools)
  pacman:
    name: "{{ item }}"
    state: present
  become: "{{ not running_as_root }}"
  loop: "{{ shinkiro_packages }}"
  when: hostname == 'shinkiro'
  ignore_errors: yes

- name: Setup CoreCtrl autostart for shinkiro
  copy:
    src: /usr/share/applications/org.corectrl.CoreCtrl.desktop
    dest: "{{ config_dir }}/autostart/org.corectrl.CoreCtrl.desktop"
    remote_src: yes
    mode: '0644'
  become: no
  when: hostname == 'shinkiro'
  ignore_errors: yes

- name: Setup polkit rule for CoreCtrl on shinkiro
  copy:
    content: |
      polkit.addRule(function(action, subject) {
          if ((action.id == "org.corectrl.helper.init" ||
               action.id == "org.corectrl.helperkiller.init") &&
              subject.local == true &&
              subject.isInGroup("wheel")) {
              return polkit.Result.YES;
          }
      });
    dest: /etc/polkit-1/rules.d/50-corectrl.rules
    mode: '0644'
  become: yes
  when: hostname == 'shinkiro'
  ignore_errors: yes

- name: Install kyrios-specific packages (Intel CPU/GPU tools)
  pacman:
    name: "{{ item }}"
    state: present
  become: "{{ not running_as_root }}"
  loop: "{{ kyrios_packages }}"
  when: hostname == 'kyrios'
  ignore_errors: yes

- name: Install barbatos-specific packages (Intel/NVIDIA hybrid, ThinkPad)
  pacman:
    name: "{{ item }}"
    state: present
  become: "{{ not running_as_root }}"
  loop: "{{ barbatos_packages }}"
  when: hostname == 'barbatos'
  ignore_errors: yes
