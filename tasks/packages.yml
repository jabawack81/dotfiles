---
# Package installation — pacman, AUR, and machine-specific packages

- name: Ensure required packages are installed (Personal machines - non-omarchy)
  pacman:
    name: "{{ item }}"
    state: present
  become: "{{ not running_as_root }}"
  loop: "{{ required_packages }}"
  when:
    - is_personal_machine
    - not is_omarchy_machine

- name: Skip package installation on omarchy machines
  debug:
    msg: |
      Skipping required_packages installation on omarchy machine.
      Omarchy manages desktop packages. Only lupus-specific packages will be installed.
  when: is_omarchy_machine

- name: Skip package installation on work machines (macOS)
  debug:
    msg: |
      Skipping package installation on macOS. Please install these packages manually via Homebrew:

      Terminal apps:
      brew install ghostty neovim lazygit jq ripgrep fd fzf bat htop btop gh broot
      brew install anomalyco/tap/opencode

      GUI apps:
      brew install --cask firefox obsidian discord slack telegram

      Note: nvtop, grim, waybar, hyprland, etc. are Linux-only
  when:
    - not is_personal_machine
    - not is_server_machine

# ── Servers (Debian) ───────────────────────────────────────────
- name: Install server packages (apt)
  apt:
    name: "{{ server_packages }}"
    state: present
    update_cache: yes
    cache_valid_time: 3600
  become: "{{ not running_as_root }}"
  when: is_server_machine

# apt's neovim lags far behind what LazyVim requires, so install the official
# release tarball into /opt/nvim-<version> and point /opt/nvim at it.
#
# The tarball is staged inside the root-owned install directory, never /tmp:
# /tmp is world-writable, so a local user could plant an archive there and
# have it unpacked as root. get_url checks the pinned sha256 and re-downloads
# on mismatch, and --no-same-owner/--no-same-permissions means nothing in the
# archive can arrive as a root-owned setuid file.
- name: Install Neovim from the official release tarball
  when: is_server_machine
  become: "{{ not running_as_root }}"
  vars:
    neovim_install_dir: "/opt/nvim-{{ neovim_release }}"
    neovim_tarball: "{{ neovim_install_dir }}/nvim-linux-{{ neovim_arch }}.tar.gz"
  block:
    - name: Check for the pinned Neovim release in /opt
      stat:
        path: "{{ neovim_install_dir }}/nvim-linux-{{ neovim_arch }}/bin/nvim"
      register: nvim_release_bin

    - name: Create the Neovim install directory
      file:
        path: "{{ neovim_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Download the Neovim release tarball
      get_url:
        url: "https://github.com/neovim/neovim/releases/download/{{ neovim_release }}/nvim-linux-{{ neovim_arch }}.tar.gz"
        dest: "{{ neovim_tarball }}"
        checksum: "sha256:{{ neovim_sha256[neovim_arch] }}"
        owner: root
        group: root
        mode: '0600'
      when: not nvim_release_bin.stat.exists

    - name: Unpack Neovim
      unarchive:
        src: "{{ neovim_tarball }}"
        dest: "{{ neovim_install_dir }}"
        remote_src: yes
        extra_opts:
          - --no-same-owner
          - --no-same-permissions
      when: not nvim_release_bin.stat.exists

    - name: Remove the downloaded tarball
      file:
        path: "{{ neovim_tarball }}"
        state: absent

    - name: Point /opt/nvim at the pinned release
      file:
        src: "{{ neovim_install_dir }}/nvim-linux-{{ neovim_arch }}"
        dest: /opt/nvim
        state: link
        force: yes

    - name: Put nvim on PATH
      file:
        src: /opt/nvim/bin/nvim
        dest: /usr/local/bin/nvim
        state: link
        force: yes

- name: Check if yay is installed
  command: which yay
  register: yay_check
  ignore_errors: yes
  changed_when: false
  when:
    - is_personal_machine
    - not is_omarchy_machine

- name: Install yay dependencies
  pacman:
    name:
      - base-devel
      - git
    state: present
  become: "{{ not running_as_root }}"
  when:
    - is_personal_machine
    - not is_omarchy_machine
    - yay_check.rc != 0

- name: Clone yay repository
  git:
    repo: https://aur.archlinux.org/yay.git
    dest: /tmp/yay
    force: yes
  when:
    - is_personal_machine
    - not is_omarchy_machine
    - yay_check.rc != 0

- name: Build and install yay
  shell: |
    cd /tmp/yay
    makepkg -si --noconfirm
  args:
    creates: /usr/bin/yay
  when:
    - is_personal_machine
    - not is_omarchy_machine
    - yay_check.rc != 0

- name: Install PipeWire audio compatibility layers
  pacman:
    name:
      - pipewire-pulse
      - pipewire-jack
    state: present
  become: "{{ not running_as_root }}"
  when:
    - is_personal_machine
    - not is_omarchy_machine

- name: Configure sudo for target user (when running as root)
  lineinfile:
    path: /etc/sudoers.d/ansible-aur
    line: "{{ target_user }} ALL=(ALL) NOPASSWD: ALL"
    create: yes
    mode: '0440'
    validate: 'visudo -cf %s'
  when:
    - running_as_root
    - is_personal_machine
    - not is_omarchy_machine

# yay refuses to run as root, so it escalates on its own via sudo. Running as a
# normal user under Ansible there is no tty for sudo to prompt on, and every
# failed attempt counts toward pam_faillock (deny=3) — which locked the account
# partway through the run and failed every become task after it. The old task
# also ended in `|| true`, so it reported "changed" for all ten packages while
# installing nothing.
#
# So: work out what is actually missing, hand sudo a working askpass, and let a
# genuine build failure be visible.
- name: Install AUR packages with yay
  when:
    - is_personal_machine
    - not is_omarchy_machine
  block:
    - name: Check which AUR packages are already installed
      command: pacman -Qq {{ item | quote }}
      register: aur_query
      loop: "{{ aur_packages }}"
      changed_when: false
      failed_when: false
      check_mode: no

    - name: Collect the missing AUR packages
      set_fact:
        aur_missing: "{{ aur_query.results | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}"

    # When running as root a temporary NOPASSWD sudoers drop-in is already in
    # place (see above), so no askpass is needed. Otherwise we need the become
    # password Ansible collected with -K.
    - name: Decide how yay should authenticate
      set_fact:
        yay_askpass: "{{ (ansible_facts['env']['XDG_RUNTIME_DIR'] | default('/tmp')) ~ '/ansible-yay-askpass' }}"
        yay_can_escalate: "{{ running_as_root or (ansible_become_password | default('')) | length > 0 }}"

    - name: Report AUR packages that need installing by hand
      debug:
        msg: >-
          {{ aur_missing | length }} AUR package(s) missing and no become password
          is available, so they were not installed: {{ aur_missing | join(', ') }}.
          Install them with: yay -S {{ aur_missing | join(' ') }}
      when:
        - aur_missing | length > 0
        - not yay_can_escalate

    - name: Install missing AUR packages
      when:
        - aur_missing | length > 0
        - yay_can_escalate
      block:
        - name: Create askpass helper for yay
          copy:
            dest: "{{ yay_askpass }}"
            mode: '0700'
            content: |
              #!/bin/sh
              printf '%s\n' {{ (ansible_become_password | default('')) | quote }}
          no_log: true
          when: not running_as_root

        - name: Install AUR packages with yay
          command: >-
            yay -S --noconfirm --norebuild --noredownload
            {{ '--sudoflags -A' if not running_as_root else '' }}
            -- {{ item | quote }}
          environment:
            SUDO_ASKPASS: "{{ yay_askpass }}"
          loop: "{{ aur_missing }}"
          become: "{{ running_as_root }}"
          become_user: "{{ target_user if running_as_root else omit }}"
          register: yay_install
          # A single flaky AUR build should not abort the whole playbook, but
          # unlike `|| true` this still shows up in the recap as ignored.
          ignore_errors: yes
      always:
        - name: Remove the yay askpass helper
          file:
            path: "{{ yay_askpass }}"
            state: absent
          when: not running_as_root

- name: Remove temporary sudo configuration
  file:
    path: /etc/sudoers.d/ansible-aur
    state: absent
  when:
    - running_as_root
    - is_personal_machine
    - not is_omarchy_machine

- name: Install shinkiro-specific packages (AMD GPU tools)
  pacman:
    name: "{{ item }}"
    state: present
  become: "{{ not running_as_root }}"
  loop: "{{ shinkiro_packages }}"
  when: hostname == 'shinkiro'
  ignore_errors: yes

- name: Setup CoreCtrl autostart for shinkiro
  copy:
    src: /usr/share/applications/org.corectrl.CoreCtrl.desktop
    dest: "{{ config_dir }}/autostart/org.corectrl.CoreCtrl.desktop"
    remote_src: yes
    mode: '0644'
  become: no
  when: hostname == 'shinkiro'
  ignore_errors: yes

- name: Setup polkit rule for CoreCtrl on shinkiro
  copy:
    content: |
      polkit.addRule(function(action, subject) {
          if ((action.id == "org.corectrl.helper.init" ||
               action.id == "org.corectrl.helperkiller.init") &&
              subject.local == true &&
              subject.isInGroup("wheel")) {
              return polkit.Result.YES;
          }
      });
    dest: /etc/polkit-1/rules.d/50-corectrl.rules
    mode: '0644'
  become: yes
  when: hostname == 'shinkiro'
  ignore_errors: yes

- name: Install kyrios-specific packages (Intel CPU/GPU tools)
  pacman:
    name: "{{ item }}"
    state: present
  become: "{{ not running_as_root }}"
  loop: "{{ kyrios_packages }}"
  when: hostname == 'kyrios'
  ignore_errors: yes

- name: Install lupus-specific packages (NVIDIA GPU)
  pacman:
    name: "{{ item }}"
    state: present
  become: "{{ not running_as_root }}"
  loop: "{{ lupus_packages }}"
  when: hostname == 'lupus'
  ignore_errors: yes

- name: Install lupus-specific AUR packages (fingerprint sensor)
  shell: yay -S --noconfirm --needed --rebuild {{ item }}
  loop: "{{ lupus_aur_packages }}"
  when: hostname == 'lupus'
  ignore_errors: yes
