---
# Dotfile symlinks — common configs, hostname-specific, work machine, scripts

- name: Create scripts directory in PATH
  file:
    path: "{{ home_dir }}/.local/bin"
    state: directory
    mode: '0755'
    owner: "{{ target_user }}"
    group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else target_user }}"

# Debian's fd-find installs the binary as `fdfind`; LazyVim's pickers look
# for `fd`, so expose it under the expected name.
- name: Link fdfind as fd for the target user
  file:
    src: /usr/bin/fdfind
    dest: "{{ home_dir }}/.local/bin/fd"
    state: link
    force: yes
  become: "{{ running_as_root }}"
  become_user: "{{ target_user if running_as_root else omit }}"
  when: is_server_machine

- name: Link tmux-claude script to PATH
  file:
    src: "{{ dotfiles_dir }}/common/scripts/tmux-claude.sh"
    dest: "{{ home_dir }}/.local/bin/tmux-claude.sh"
    state: link
    force: yes
  become: "{{ running_as_root }}"
  become_user: "{{ target_user if running_as_root else omit }}"
  when: not is_server_machine

- name: Link fan-control script to PATH (shinkiro only)
  file:
    src: "{{ dotfiles_dir }}/common/scripts/fan-control.sh"
    dest: "{{ home_dir }}/.local/bin/fan-control"
    state: link
    force: yes
  become: "{{ running_as_root }}"
  become_user: "{{ target_user if running_as_root else omit }}"
  when: hostname == 'shinkiro'

- name: Check if wayland-sessions directory exists
  stat:
    path: /usr/share/wayland-sessions
  register: wayland_sessions_dir

- name: Install Hyprland session entries (waybar + quickshell)
  copy:
    src: "{{ dotfiles_dir }}/common/wayland-sessions/{{ item }}"
    dest: "/usr/share/wayland-sessions/{{ item }}"
    mode: '0644'
  loop:
    - hyprland-waybar.desktop
    - hyprland-quickshell.desktop
    - hyprland-caelestia.desktop
  become: yes
  when:
    - is_personal_machine
    - wayland_sessions_dir.stat.exists

- name: Ensure .config directory exists
  file:
    path: "{{ config_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ target_user }}"
    group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else target_user }}"

- name: Get list of common configs
  find:
    paths: "{{ dotfiles_dir }}/common"
    file_type: directory
    recurse: no
  register: common_configs

- name: Debug - Show common configs found
  debug:
    msg: "Found configs: {{ common_configs.files | map(attribute='path') | map('basename') | list }}"
  when: is_personal_machine

# The four tasks below (stat -> backup -> remove -> symlink) must
# share one exclusion list. They drifted once: 'git' was excluded from the
# symlink step but not the removal step, so ~/.config/git was deleted on every
# run and never recreated. Anything added to one list goes in all four.
#
# Why each is excluded: thunar/waybar/hypr get bespoke symlink tasks in
# desktop.yml; claude is built up file-by-file in claude.yml; bin is a binary
# drop, not a config; wayland-sessions is installed system-wide to /usr/share
# earlier in this file; git is wired up by absolute path via
# core.excludesfile in devtools.yml, so it needs no ~/.config entry at all.
- name: Handle common configs with backup
  block:
    - name: Check existing configs
      stat:
        path: "{{ config_dir }}/{{ item.path | basename }}"
      register: config_stat
      loop: "{{ common_configs.files }}"
      when:
        - is_personal_machine
        - item.path | basename not in ['thunar', 'waybar', 'bin', 'hypr', 'git', 'claude', 'wayland-sessions']

    - name: Backup existing configs that aren't symlinks
      command: mv "{{ config_dir }}/{{ item.item.path | basename }}" "{{ backup_dir }}/{{ item.item.path | basename }}-backup"
      loop: "{{ config_stat.results }}"
      when:
        - is_personal_machine
        - item.stat is defined
        - item.stat.exists
        - not item.stat.islnk
        - item.item.path | basename not in ['thunar', 'waybar', 'bin', 'hypr', 'git', 'claude', 'wayland-sessions']
      loop_control:
        label: "{{ item.item.path | basename }}"

    - name: Remove existing config directories after backup
      file:
        path: "{{ config_dir }}/{{ item.item.path | basename }}"
        state: absent
      loop: "{{ config_stat.results }}"
      when:
        - is_personal_machine
        - item.stat is defined
        - item.stat.exists
        - not item.stat.islnk
        - item.item.path | basename not in ['thunar', 'waybar', 'bin', 'hypr', 'git', 'claude', 'wayland-sessions']
      loop_control:
        label: "{{ item.item.path | basename }}"

    # A config that also exists under <hostname>/ is linked from there
    # later in this file; linking the common one first just flip-flops.
    - name: Create symlinks for common configs (personal machines)
      file:
        src: "{{ item.path }}"
        dest: "{{ config_dir }}/{{ item.path | basename }}"
        state: link
        force: yes
        owner: "{{ target_user }}"
        group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else target_user }}"
      loop: "{{ common_configs.files }}"
      when:
        - is_personal_machine
        - item.path | basename not in ['thunar', 'waybar', 'bin', 'hypr', 'git', 'claude', 'wayland-sessions']
        - not (dotfiles_dir ~ '/' ~ hostname ~ '/' ~ (item.path | basename)) is directory

    - name: Link nvim .neoconf.json file
      file:
        src: "{{ dotfiles_dir }}/common/nvim/dot_neoconf.json"
        dest: "{{ config_dir }}/nvim/.neoconf.json"
        state: link
        force: yes
        owner: "{{ target_user }}"
        group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else target_user }}"
      when: is_personal_machine

- name: Create symlinks for common configs (work machine - limited)
  file:
    src: "{{ item.path }}"
    dest: "{{ config_dir }}/{{ item.path | basename }}"
    state: link
    force: yes
  loop: "{{ common_configs.files }}"
  when:
    - not is_personal_machine
    - not is_server_machine
    - item.path | basename in work_configs

- name: Create symlinks for common configs (server - editor only)
  file:
    src: "{{ item.path }}"
    dest: "{{ config_dir }}/{{ item.path | basename }}"
    state: link
    force: yes
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
  loop: "{{ common_configs.files }}"
  when:
    - is_server_machine
    - item.path | basename in server_configs

- name: Link nvim .neoconf.json file (work machine and server)
  file:
    src: "{{ dotfiles_dir }}/common/nvim/dot_neoconf.json"
    dest: "{{ config_dir }}/nvim/.neoconf.json"
    state: link
    force: yes
  when: not is_personal_machine

- name: Link private nvim config from private-config (work-specific LSP, plugins)
  block:
    - name: Check if private nvim config exists in private-config
      stat:
        path: "{{ dotfiles_dir }}/private-config/nvim/lua/private"
      register: private_nvim_dir

    - name: Ensure nvim lua directory exists
      file:
        path: "{{ config_dir }}/nvim/lua"
        state: directory
        mode: '0755'
      when: private_nvim_dir.stat.exists

    - name: Symlink private nvim lua directory
      file:
        src: "{{ dotfiles_dir }}/private-config/nvim/lua/private"
        dest: "{{ config_dir }}/nvim/lua/private"
        state: link
        force: yes
      when: private_nvim_dir.stat.exists
  when: private_config_loaded

- name: Check if hostname-specific directory exists
  stat:
    path: "{{ dotfiles_dir }}/{{ hostname }}"
  register: hostname_dir

- name: Get list of hostname-specific configs
  find:
    paths: "{{ dotfiles_dir }}/{{ hostname }}"
    file_type: directory
    recurse: no
  register: hostname_configs
  when: hostname_dir.stat.exists

- name: Create symlinks for hostname-specific configs
  file:
    src: "{{ item.path }}"
    dest: "{{ config_dir }}/{{ item.path | basename }}"
    state: link
    force: yes
  loop: "{{ hostname_configs.files }}"
  when:
    - hostname_dir.stat.exists
    # greetd is a system config installed to /etc by desktop.yml; the rest
    # are handled by their own symlink tasks there.
    - item.path | basename not in ['waybar', 'hypr', 'claude', 'greetd']

- name: Link .tmux.conf to home directory
  file:
    src: "{{ dotfiles_dir }}/dot_tmux.conf"
    dest: "{{ target_home }}/.tmux.conf"
    state: link
    force: yes
    owner: "{{ target_user }}"
    group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else target_user }}"

